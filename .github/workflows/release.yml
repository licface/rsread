name: Release

# Push a tag like v0.1.0 (must match the version in Cargo.toml).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          crate_ver=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          tag_ver="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $crate_ver / tag: $tag_ver"
          if [ "$crate_ver" != "$tag_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_ver"
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rsread-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

